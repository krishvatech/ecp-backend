# Project-owned allowlist for disposable email domain checks.
#
# A domain listed here is never treated as disposable, even when it (or one of
# its parent domains) appears in disposable_email_blocklist.conf. Allowlisting
# a domain also allows its subdomains.
#
# Use this to fix a confirmed false positive. Add one domain per line, in
# lowercase, with a short comment saying why and who approved it. Changes go
# through normal code review; nothing updates this file automatically.
#
# The upstream project no longer publishes an allowlist, so this file starts
# empty.
